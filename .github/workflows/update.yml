name: 政治ニュース自動更新

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch: {}
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: サイトを生成
        run: python build_site.py

      - name: 変更をコミット
        run: |

          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add index.html news_data.json
          git diff --quiet --cached || git commit -m "自動更新: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
